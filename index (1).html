<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RankIt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #080810; --surface: #10101c; --raised: #18182a; --border: #24243a;
      --text: #ffffff; --secondary: #b0b0cc; --dim: #707088;
      --fd: 'Bebas Neue', sans-serif;
      --fb: 'DM Sans', sans-serif;
      --fm: 'DM Mono', monospace;
    }
    html, body { background: #080810; min-height: 100vh; }
    body { font-family: var(--fb); color: var(--text); }
    #root { background: #080810; min-height: 100vh; }

    .screen { max-width: 480px; margin: 0 auto; padding: 22px 16px 56px; min-height: 100vh; display: flex; flex-direction: column; gap: 12px; }
    .center-screen { justify-content: center; align-items: center; text-align: center; gap: 0; }

    .brand { font-family: var(--fd); font-size: clamp(72px, 20vw, 108px); line-height: 0.9; margin-bottom: 8px; }
    .b-solid { color: #fff; text-shadow: 0 0 40px rgba(255,255,255,0.2); }
    .b-outline { color: transparent; -webkit-text-stroke: 2px #fff; }
    .tagline { font-family: var(--fm); font-size: 11px; letter-spacing: 0.18em; color: var(--secondary); text-transform: uppercase; margin-bottom: 40px; }

    .sport-row { display: flex; gap: 10px; margin-bottom: 24px; width: 100%; max-width: 340px; }
    .sport-tile { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px 12px 20px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: all 0.15s; }
    .sport-tile:hover { transform: translateY(-4px); }
    .nfl-tile:hover { border-color: #ff3355; background: #1a0810; box-shadow: 0 8px 32px rgba(255,51,85,0.2); }
    .nba-tile:hover { border-color: #4488ff; background: #08101a; box-shadow: 0 8px 32px rgba(68,136,255,0.2); }
    .tile-emoji { font-size: 36px; margin-bottom: 4px; }
    .tile-name { font-family: var(--fd); font-size: 36px; color: #fff; }
    .tile-sub { font-family: var(--fm); font-size: 10px; color: var(--dim); letter-spacing: 0.1em; }

    .rules-box { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; text-align: left; max-width: 340px; width: 100%; }
    .rules-title { font-family: var(--fm); font-size: 10px; letter-spacing: 0.2em; color: var(--dim); margin-bottom: 14px; }
    .rules-list { display: flex; flex-direction: column; gap: 10px; }
    .rule-row { display: flex; align-items: center; gap: 12px; font-size: 14px; color: var(--secondary); line-height: 1.4; }
    .rule-n { font-family: var(--fd); font-size: 20px; color: var(--dim); flex-shrink: 0; width: 18px; }

    .game-header { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .back-btn { background: var(--surface); border: 1px solid var(--border); color: var(--secondary); font-family: var(--fm); font-size: 11px; letter-spacing: 0.06em; padding: 7px 13px; border-radius: 20px; cursor: pointer; white-space: nowrap; transition: all 0.15s; flex-shrink: 0; }
    .back-btn:hover { color: #fff; border-color: #444466; }
    .header-center { flex: 1; display: flex; justify-content: center; }
    .round-indicator { display: flex; gap: 5px; align-items: center; }
    .ri-dot { height: 5px; border-radius: 10px; transition: all 0.3s; }
    .sport-badge { font-family: var(--fm); font-size: 11px; font-weight: 500; letter-spacing: 0.1em; color: #fff; padding: 6px 12px; border-radius: 20px; flex-shrink: 0; }

    .puzzle-info { padding: 16px 18px; background: #ffffff; border-radius: 14px; }
    .puzzle-category { font-family: var(--fd); font-size: clamp(42px, 10vw, 58px); letter-spacing: 0.01em; line-height: 1; color: #080810; }
    .puzzle-note { font-family: var(--fm); font-size: 12px; color: #555; letter-spacing: 0.04em; margin-top: 6px; }

    .running-score-bar { display: flex; justify-content: space-between; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; }
    .rsb-label { font-family: var(--fm); font-size: 11px; color: var(--secondary); letter-spacing: 0.08em; }
    .rsb-val { font-family: var(--fd); font-size: 22px; color: #fff; }

    .ranking-area { display: flex; flex-direction: column; gap: 12px; flex: 1; }
    .step-dots { display: flex; align-items: center; gap: 5px; }
    .step-dot { height: 4px; border-radius: 10px; transition: all 0.3s; }
    .step-label { font-family: var(--fd); font-size: 22px; margin-left: 8px; color: var(--secondary); }

    .player-card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 28px 20px 24px; text-align: center; animation: cardIn 0.2s cubic-bezier(0.34,1.56,0.64,1); }
    @keyframes cardIn { from { opacity: 0; transform: scale(0.94) translateY(6px); } to { opacity: 1; transform: none; } }
    .pc-eyebrow { font-family: var(--fm); font-size: 10px; letter-spacing: 0.2em; margin-bottom: 10px; }
    .pc-name { font-family: var(--fd); font-size: clamp(32px, 8vw, 46px); line-height: 1.05; color: #fff; }
    .pc-cue { font-family: var(--fm); font-size: 11px; color: var(--secondary); letter-spacing: 0.1em; margin-top: 10px; }

    .rank-options { display: flex; gap: 7px; }
    .rank-option { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 4px 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; transition: all 0.15s; }
    .rank-option:hover:not(:disabled) { background: var(--raised); transform: translateY(-3px); border-color: #38385a; }
    .rank-option:active:not(:disabled) { transform: scale(0.95); }
    .rank-option:disabled { opacity: 0.3; cursor: not-allowed; }
    .ro-num { font-family: var(--fd); font-size: 32px; line-height: 1; }
    .ro-desc { font-family: var(--fm); font-size: 9px; color: var(--secondary); }

    .history-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
    .history-label { font-family: var(--fm); font-size: 10px; letter-spacing: 0.16em; color: var(--dim); margin-bottom: 2px; }
    .history-row { display: flex; align-items: center; gap: 10px; }
    .h-rank { font-family: var(--fd); font-size: 20px; width: 28px; }
    .h-name { flex: 1; font-size: 15px; font-weight: 600; color: #fff; }
    .h-lock { font-size: 12px; opacity: 0.6; }

    .result-area { display: flex; flex-direction: column; gap: 10px; flex: 1; }
    .round-banner { display: flex; justify-content: space-between; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px 18px; }
    .rb-left, .rb-right { display: flex; flex-direction: column; gap: 3px; }
    .rb-right { text-align: right; }
    .rb-label { font-family: var(--fm); font-size: 10px; letter-spacing: 0.14em; color: var(--secondary); }
    .rb-score { font-family: var(--fd); font-size: 30px; }
    .rb-total { font-family: var(--fd); font-size: 30px; }

    .result-rows { display: flex; flex-direction: column; gap: 6px; }
    .result-row { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 11px 14px; display: flex; align-items: center; gap: 10px; }
    .rr-correct { font-family: var(--fd); font-size: 26px; width: 22px; text-align: center; flex-shrink: 0; }
    .rr-info { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .rr-name { font-size: 15px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rr-val { font-family: var(--fm); font-size: 11px; letter-spacing: 0.02em; }
    .rr-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .rr-yours { font-family: var(--fm); font-size: 11px; color: var(--secondary); }
    .rr-chip { font-family: var(--fd); font-size: 17px; width: 46px; height: 34px; border: 2px solid; border-radius: 8px; display: flex; align-items: center; justify-content: center; }

    .final-area { display: flex; flex-direction: column; gap: 14px; flex: 1; padding-top: 4px; }
    .final-headline { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px 0 8px; }
    .fh-label { font-family: var(--fm); font-size: 11px; letter-spacing: 0.2em; color: var(--secondary); }
    .fh-total { font-family: var(--fd); font-size: 80px; line-height: 1; }
    .fh-unit { font-size: 30px; color: var(--secondary); }
    .fh-rating { font-family: var(--fd); font-size: 22px; letter-spacing: 0.12em; border: 2px solid; padding: 5px 22px; border-radius: 30px; }

    .final-rounds { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
    .fr-header { font-family: var(--fm); font-size: 10px; letter-spacing: 0.18em; color: var(--secondary); padding: 14px 16px 8px; }
    .fr-row { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-top: 1px solid var(--border); }
    .fr-label { font-family: var(--fm); font-size: 12px; color: var(--secondary); width: 56px; flex-shrink: 0; }
    .fr-puzzle { flex: 1; font-size: 14px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fr-score { font-family: var(--fd); font-size: 22px; flex-shrink: 0; min-width: 36px; text-align: right; }
    .fr-total-row { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-top: 1px solid #30304a; background: #0c0c18; }
    .fr-total-val { font-family: var(--fd); font-size: 28px; flex-shrink: 0; min-width: 36px; text-align: right; color: #fff; }

    .perfect-callout { border: 1px solid; border-radius: 12px; padding: 12px 16px; font-family: var(--fm); font-size: 13px; letter-spacing: 0.08em; text-align: center; }

    .cta-btn { width: 100%; padding: 17px; border-radius: 14px; font-family: var(--fd); font-size: 24px; letter-spacing: 0.06em; cursor: pointer; color: #fff; border: none; transition: all 0.15s; margin-top: auto; }
    .cta-btn:hover { transform: translateY(-2px); filter: brightness(1.1); }
    .cta-btn:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const PUZZLES = {
      nfl: [
        { id:"nfl-1", category:"Career Receiving TDs", note:"Rank #1 = most touchdowns",
          items:[{label:"Jerry Rice",value:"197 TDs"},{label:"Randy Moss",value:"156 TDs"},{label:"Terrell Owens",value:"153 TDs"},{label:"Cris Carter",value:"130 TDs"},{label:"Antonio Gates",value:"116 TDs"}] },
        { id:"nfl-2", category:"Career Rushing Yards", note:"Rank #1 = most yards",
          items:[{label:"Emmitt Smith",value:"18,355 yds"},{label:"Walter Payton",value:"16,726 yds"},{label:"Frank Gore",value:"16,106 yds"},{label:"Barry Sanders",value:"15,269 yds"},{label:"Curtis Martin",value:"14,101 yds"}] },
        { id:"nfl-3", category:"Career Passing TDs", note:"Rank #1 = most touchdowns (retired)",
          items:[{label:"Tom Brady",value:"649 TDs"},{label:"Drew Brees",value:"571 TDs"},{label:"Peyton Manning",value:"539 TDs"},{label:"Brett Favre",value:"508 TDs"},{label:"Dan Marino",value:"420 TDs"}] },
        { id:"nfl-4", category:"Single Season Rushing Yards", note:"Rank #1 = most yards in one season",
          items:[{label:"Eric Dickerson (1984)",value:"2,105 yds"},{label:"Adrian Peterson (2012)",value:"2,097 yds"},{label:"Jamal Lewis (2003)",value:"2,066 yds"},{label:"Barry Sanders (1997)",value:"2,053 yds"},{label:"Chris Johnson (2009)",value:"2,006 yds"}] },
        { id:"nfl-5", category:"Career Interceptions", note:"Rank #1 = most INTs all-time",
          items:[{label:"Paul Krause",value:"81 INTs"},{label:"Emlen Tunnell",value:"79 INTs"},{label:"Rod Woodson",value:"71 INTs"},{label:"Night Train Lane",value:"68 INTs"},{label:"Ken Riley",value:"65 INTs"}] },
        { id:"nfl-6", category:"Single Season Passing TDs", note:"Rank #1 = most TDs in one season",
          items:[{label:"Peyton Manning (2013)",value:"55 TDs"},{label:"Patrick Mahomes (2018)",value:"50 TDs"},{label:"Dan Marino (1984)",value:"48 TDs"},{label:"Aaron Rodgers (2011)",value:"45 TDs"},{label:"Kurt Warner (1999)",value:"41 TDs"}] },
        { id:"nfl-7", category:"Career Sacks", note:"Rank #1 = most sacks all-time",
          items:[{label:"Bruce Smith",value:"200.0"},{label:"Reggie White",value:"198.0"},{label:"Kevin Greene",value:"160.0"},{label:"Chris Doleman",value:"150.5"},{label:"Michael Strahan",value:"141.5"}] },
        { id:"nfl-8", category:"Career Receptions", note:"Rank #1 = most catches (retired)",
          items:[{label:"Jerry Rice",value:"1,549 rec"},{label:"Larry Fitzgerald",value:"1,432 rec"},{label:"Tony Gonzalez",value:"1,325 rec"},{label:"Jason Witten",value:"1,228 rec"},{label:"Reggie Wayne",value:"1,070 rec"}] },
      ],
      nba: [
        { id:"nba-1", category:"Career Points (Retired)", note:"Rank #1 = most points scored",
          items:[{label:"Kareem Abdul-Jabbar",value:"38,387 pts"},{label:"Karl Malone",value:"36,928 pts"},{label:"Kobe Bryant",value:"33,643 pts"},{label:"Michael Jordan",value:"32,292 pts"},{label:"Dirk Nowitzki",value:"31,560 pts"}] },
        { id:"nba-2", category:"Career Assists", note:"Rank #1 = most assists all-time",
          items:[{label:"John Stockton",value:"15,806 ast"},{label:"Jason Kidd",value:"12,091 ast"},{label:"Steve Nash",value:"10,335 ast"},{label:"Magic Johnson",value:"10,141 ast"},{label:"Oscar Robertson",value:"9,887 ast"}] },
        { id:"nba-3", category:"Career Rebounds", note:"Rank #1 = most rebounds all-time",
          items:[{label:"Wilt Chamberlain",value:"23,924 reb"},{label:"Bill Russell",value:"21,620 reb"},{label:"Moses Malone",value:"17,834 reb"},{label:"Kareem Abdul-Jabbar",value:"17,440 reb"},{label:"Elvin Hayes",value:"16,279 reb"}] },
        { id:"nba-4", category:"Single Season Scoring Avg", note:"Rank #1 = highest PPG in one season",
          items:[{label:"Wilt Chamberlain (1961-62)",value:"50.4 PPG"},{label:"Michael Jordan (1986-87)",value:"37.1 PPG"},{label:"James Harden (2018-19)",value:"36.1 PPG"},{label:"Rick Barry (1966-67)",value:"35.6 PPG"},{label:"Kobe Bryant (2005-06)",value:"35.4 PPG"}] },
        { id:"nba-5", category:"Career Blocks", note:"Rank #1 = most blocks all-time",
          items:[{label:"Hakeem Olajuwon",value:"3,830 blk"},{label:"Dikembe Mutombo",value:"3,289 blk"},{label:"Kareem Abdul-Jabbar",value:"3,189 blk"},{label:"Mark Eaton",value:"3,064 blk"},{label:"David Robinson",value:"2,954 blk"}] },
        { id:"nba-6", category:"Career Steals", note:"Rank #1 = most steals all-time",
          items:[{label:"John Stockton",value:"3,265 stl"},{label:"Jason Kidd",value:"2,684 stl"},{label:"Michael Jordan",value:"2,514 stl"},{label:"Gary Payton",value:"2,445 stl"},{label:"Maurice Cheeks",value:"2,310 stl"}] },
        { id:"nba-7", category:"Highest Single-Game Score", note:"Rank #1 = most points in one game",
          items:[{label:"Wilt Chamberlain",value:"100 pts"},{label:"Kobe Bryant",value:"81 pts"},{label:"David Thompson",value:"73 pts"},{label:"David Robinson",value:"71 pts"},{label:"Devin Booker",value:"70 pts"}] },
        { id:"nba-8", category:"Career Games Played", note:"Rank #1 = most games in NBA history",
          items:[{label:"Robert Parish",value:"1,611 G"},{label:"Kareem Abdul-Jabbar",value:"1,560 G"},{label:"Dirk Nowitzki",value:"1,522 G"},{label:"John Stockton",value:"1,504 G"},{label:"Karl Malone",value:"1,476 G"}] },
      ],
    };

    const ROUNDS = 5;

    function shuffleIndices(n) {
      const arr = Array.from({ length: n }, (_, i) => i);
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function computeFeedback(rankOf) {
      return rankOf.map((userRank, itemIdx) => {
        const correctRank = itemIdx + 1;
        const distance = Math.abs(userRank - correctRank);
        const direction = distance === 0 ? "correct" : userRank > correctRank ? "up" : "down";
        return { distance, direction };
      });
    }

    function fbColor(d) {
      if (d === 0) return "#00e676";
      if (d === 1) return "#ffd600";
      if (d === 2) return "#ff6d00";
      return "#f44336";
    }

    function fbLabel({ direction, distance }) {
      if (direction === "correct") return "✓";
      return (direction === "up" ? "↑" : "↓") + distance;
    }

    function getRating(totalSpots, rounds) {
      const avg = totalSpots / rounds;
      if (avg === 0) return { label: "GOAT", color: "#00e676" };
      if (avg <= 1.5) return { label: "ELITE", color: "#7cfc00" };
      if (avg <= 3) return { label: "SOLID", color: "#ffd600" };
      if (avg <= 5) return { label: "DECENT", color: "#ff8c00" };
      return { label: "ROUGH", color: "#f44336" };
    }

    function pickPuzzles(sport, n) {
      const pool = [...PUZZLES[sport]];
      const out = [];
      while (out.length < n && pool.length > 0) {
        const i = Math.floor(Math.random() * pool.length);
        out.push(pool.splice(i, 1)[0]);
      }
      return out;
    }

    function SportSelect({ onSelect }) {
      return (
        <div className="screen center-screen">
          <div className="brand">
            <span className="b-solid">RANK</span>
            <span className="b-outline">IT</span>
          </div>
          <p className="tagline">One shot. Five rounds. No mercy.</p>
          <div className="sport-row">
            {[{id:"nfl",emoji:"🏈",label:"NFL"},{id:"nba",emoji:"🏀",label:"NBA"}].map(s => (
              <button key={s.id} className={`sport-tile ${s.id}-tile`} onClick={() => onSelect(s.id)}>
                <span className="tile-emoji">{s.emoji}</span>
                <span className="tile-name">{s.label}</span>
                <span className="tile-sub">{ROUNDS} rounds</span>
              </button>
            ))}
          </div>
          <div className="rules-box">
            <div className="rules-title">HOW IT WORKS</div>
            <div className="rules-list">
              <div className="rule-row"><span className="rule-n">1</span>A player appears. Assign a rank (1–5).</div>
              <div className="rule-row"><span className="rule-n">2</span>Locked in. Next player appears. Repeat.</div>
              <div className="rule-row"><span className="rule-n">3</span>One submission per round. No do-overs.</div>
              <div className="rule-row"><span className="rule-n">4</span>Score = spots off. Low score wins.</div>
            </div>
          </div>
        </div>
      );
    }

    function BlindRanking({ puzzle, sport, onSubmit }) {
      const [presentOrder] = useState(() => shuffleIndices(5));
      const [step, setStep] = useState(0);
      const [rankOf, setRankOf] = useState(Array(5).fill(null));
      const [assigned, setAssigned] = useState([]);
      const [transitioning, setTransitioning] = useState(false);

      const accent = sport === "nfl" ? "#ff3355" : "#4488ff";
      const usedRanks = new Set(rankOf.filter(r => r !== null));
      const available = [1,2,3,4,5].filter(r => !usedRanks.has(r));
      const currentItemIdx = presentOrder[step];
      const current = puzzle.items[currentItemIdx];
      const isLast = step === 4;

      function assign(rank) {
        if (transitioning) return;
        setTransitioning(true);
        const next = [...rankOf];
        next[currentItemIdx] = rank;
        setRankOf(next);
        const nextAssigned = [...assigned, { label: current.label, rank }];
        setAssigned(nextAssigned);
        if (isLast) {
          setTimeout(() => onSubmit(next), 380);
        } else {
          setTimeout(() => { setStep(s => s + 1); setTransitioning(false); }, 300);
        }
      }

      return (
        <div className="ranking-area">
          <div className="step-dots">
            {[0,1,2,3,4].map(i => (
              <div key={i} className="step-dot" style={{
                background: i <= step ? accent : "#24243a",
                width: i === step ? 28 : 16,
                opacity: i <= step ? 1 : 0.4,
              }} />
            ))}
            <span className="step-label">{step + 1}<span style={{color:"#444466"}}>/5</span></span>
          </div>
          <div className="player-card" key={step}>
            <div className="pc-eyebrow" style={{ color: accent }}>PLAYER {step + 1} OF 5</div>
            <div className="pc-name">{current.label}</div>
            <div className="pc-cue">Assign a rank</div>
          </div>
          <div className="rank-options">
            {available.map(rank => (
              <button key={rank} className="rank-option"
                onClick={() => assign(rank)} disabled={transitioning}>
                <span className="ro-num" style={{ color: accent }}>{rank}</span>
                <span className="ro-desc">{rank === 1 ? "BEST" : rank === 5 ? "WORST" : `#${rank}`}</span>
              </button>
            ))}
          </div>
          {assigned.length > 0 && (
            <div className="history-panel">
              <div className="history-label">LOCKED IN</div>
              {assigned.map((a, i) => (
                <div key={i} className="history-row">
                  <span className="h-rank" style={{ color: accent }}>#{a.rank}</span>
                  <span className="h-name">{a.label}</span>
                  <span className="h-lock">🔒</span>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    function RoundResult({ puzzle, rankOf, sport, roundNum, totalRounds, runningTotal, onNext }) {
      const accent = sport === "nfl" ? "#ff3355" : "#4488ff";
      const feedback = computeFeedback(rankOf);
      const roundScore = feedback.reduce((s, f) => s + f.distance, 0);
      const isLast = roundNum === totalRounds;
      const newTotal = runningTotal + roundScore;

      return (
        <div className="result-area">
          <div className="round-banner">
            <div className="rb-left">
              <div className="rb-label">ROUND {roundNum}</div>
              <div className="rb-score" style={{ color: roundScore === 0 ? "#00e676" : accent }}>
                {roundScore === 0 ? "PERFECT" : `${roundScore} off`}
              </div>
            </div>
            <div className="rb-right">
              <div className="rb-label">RUNNING TOTAL</div>
              <div className="rb-total" style={{ color: accent }}>{newTotal}</div>
            </div>
          </div>
          <div className="result-rows">
            {puzzle.items.map((item, idx) => {
              const fb = feedback[idx];
              return (
                <div key={idx} className="result-row">
                  <span className="rr-correct" style={{ color: accent }}>{idx + 1}</span>
                  <div className="rr-info">
                    <span className="rr-name">{item.label}</span>
                    <span className="rr-val" style={{ color: accent }}>{item.value}</span>
                  </div>
                  <div className="rr-right">
                    <span className="rr-yours">you: #{rankOf[idx]}</span>
                    <div className="rr-chip" style={{ color: fbColor(fb.distance), borderColor: fbColor(fb.distance) }}>
                      {fbLabel(fb)}
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
          <button className="cta-btn"
            style={isLast ? { background:"transparent", border:`2px solid ${accent}`, color: accent } : { background: accent }}
            onClick={onNext}>
            {isLast ? "SEE FINAL SCORE →" : `ROUND ${roundNum + 1} →`}
          </button>
        </div>
      );
    }

    function FinalScore({ sport, roundScores, puzzles, onPlayAgain }) {
      const accent = sport === "nfl" ? "#ff3355" : "#4488ff";
      const total = roundScores.reduce((a, b) => a + b, 0);
      const rating = getRating(total, ROUNDS);
      const perfectRounds = roundScores.filter(s => s === 0).length;

      return (
        <div className="final-area">
          <div className="final-headline">
            <div className="fh-label">FINAL SCORE</div>
            <div className="fh-total" style={{ color: total === 0 ? "#00e676" : "#fff" }}>
              {total}<span className="fh-unit"> spots off</span>
            </div>
            <div className="fh-rating" style={{ color: rating.color, borderColor: rating.color }}>{rating.label}</div>
          </div>
          <div className="final-rounds">
            <div className="fr-header">ROUND BY ROUND</div>
            {roundScores.map((score, i) => (
              <div key={i} className="fr-row">
                <span className="fr-label">Round {i + 1}</span>
                <span className="fr-puzzle">{puzzles[i].category}</span>
                <span className="fr-score" style={{ color: score === 0 ? "#00e676" : score <= 2 ? "#ffd600" : score <= 5 ? "#ff6d00" : "#f44336" }}>
                  {score === 0 ? "✓ 0" : score}
                </span>
              </div>
            ))}
            <div className="fr-total-row">
              <span className="fr-label">Total</span>
              <span style={{flex:1}} />
              <span className="fr-total-val" style={{ color: accent }}>{total}</span>
            </div>
          </div>
          {perfectRounds > 0 && (
            <div className="perfect-callout" style={{ borderColor:"#00e67644", color:"#00e676" }}>
              🎯 {perfectRounds} perfect round{perfectRounds > 1 ? "s" : ""}
            </div>
          )}
          <button className="cta-btn" style={{ background: accent }} onClick={onPlayAgain}>PLAY AGAIN</button>
        </div>
      );
    }

    function App() {
      const [sport, setSport] = useState(null);
      const [phase, setPhase] = useState("select");
      const [puzzles, setPuzzles] = useState([]);
      const [round, setRound] = useState(0);
      const [rankOf, setRankOf] = useState(null);
      const [roundScores, setRoundScores] = useState([]);

      function startGame(s) {
        setSport(s); setPuzzles(pickPuzzles(s, ROUNDS));
        setRound(0); setRoundScores([]); setRankOf(null); setPhase("ranking");
      }

      function handleSubmit(finalRankOf) { setRankOf(finalRankOf); setPhase("result"); }

      function handleNext() {
        const fb = computeFeedback(rankOf);
        const score = fb.reduce((s, f) => s + f.distance, 0);
        const newScores = [...roundScores, score];
        setRoundScores(newScores);
        if (round + 1 >= ROUNDS) { setPhase("final"); }
        else { setRound(r => r + 1); setRankOf(null); setPhase("ranking"); }
      }

      const runningTotal = roundScores.reduce((a, b) => a + b, 0);
      const accent = sport === "nfl" ? "#ff3355" : "#4488ff";

      if (phase === "select") return <SportSelect onSelect={startGame} />;

      return (
        <div className="screen">
          <div className="game-header">
            <button className="back-btn" onClick={() => setPhase("select")}>← Sports</button>
            <div className="header-center">
              {phase !== "final" && (
                <div className="round-indicator">
                  {Array.from({length: ROUNDS}).map((_, i) => (
                    <div key={i} className="ri-dot" style={{
                      background: i <= round ? accent : "#24243a",
                      opacity: i <= round ? 1 : 0.3,
                      width: i === round ? 24 : 16,
                    }} />
                  ))}
                </div>
              )}
            </div>
            <div className="sport-badge" style={{ background: accent }}>{sport && sport.toUpperCase()}</div>
          </div>

          {phase !== "final" && puzzles[round] && (
            <div className="puzzle-info">
              <div className="puzzle-category">{puzzles[round].category}</div>
              <div className="puzzle-note">{puzzles[round].note}</div>
            </div>
          )}

          {phase === "ranking" && round > 0 && (
            <div className="running-score-bar">
              <span className="rsb-label">RUNNING TOTAL</span>
              <span className="rsb-val">{runningTotal} spots off</span>
            </div>
          )}

          {phase === "ranking" && puzzles[round] && (
            <BlindRanking key={round} puzzle={puzzles[round]} sport={sport} onSubmit={handleSubmit} />
          )}
          {phase === "result" && puzzles[round] && rankOf && (
            <RoundResult puzzle={puzzles[round]} rankOf={rankOf} sport={sport}
              roundNum={round + 1} totalRounds={ROUNDS} runningTotal={runningTotal} onNext={handleNext} />
          )}
          {phase === "final" && (
            <FinalScore sport={sport} roundScores={roundScores} puzzles={puzzles} onPlayAgain={() => startGame(sport)} />
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
